const PSER={mh:{name:"Maple Hills",col:"#f6b7c8"}};
function drawPoster(cv,sel,items,imgs){
 const ctx=cv.getContext("2d");
 const F={script:'"Allura", "Brush Script MT", cursive',disp:'"Fraunces", Georgia, serif',body:'"Nunito Sans", "Segoe UI", system-ui, sans-serif'};
 const COLS=Math.min(4,Math.max(1,items.length)),W=1500,M=80,GAP=40,CW=(W-2*M-(COLS-1)*GAP)/COLS,CH=CW*1.5,TXT=110,RGAP=40,HEAD=350,FOOT=150;
 const rows=Math.max(1,Math.ceil(items.length/COLS)),H=HEAD+rows*(CH+TXT)+(rows-1)*RGAP+FOOT;
 cv.width=W;cv.height=H;
 const rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()};
 const wrap=(t,mw,font)=>{ctx.font=font;const ws=t.split(" "),L=[];let c="";for(const w of ws){const x=c?c+" "+w:w;if(ctx.measureText(x).width>mw&&c){L.push(c);c=w}else c=x}if(c)L.push(c);
  if(L.length>2){L.length=2;let l=L[1];while(ctx.measureText(l+"…").width>mw&&l.length)l=l.slice(0,-1);L[1]=l+"…"}return L};
 const shade=(hex,p)=>{const n=parseInt(hex.slice(1),16),f=v=>Math.max(0,Math.min(255,Math.round(v+(p<0?v*p:(255-v)*p))));return"#"+[n>>16,n>>8&255,n&255].map(v=>f(v).toString(16).padStart(2,"0")).join("")};
 const spaced=(t,x,y,sp)=>{let w=0;for(const ch of t)w+=ctx.measureText(ch).width+sp;w-=sp;let cx=x-w/2;const a=ctx.textAlign;ctx.textAlign="left";for(const ch of t){ctx.fillText(ch,cx,y);cx+=ctx.measureText(ch).width+sp}ctx.textAlign=a};
 // dusk sky
 const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#8e98e6");bg.addColorStop(.3,"#6a63c0");bg.addColorStop(.68,"#2f2a6b");bg.addColorStop(1,"#15133a");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 const glow=ctx.createRadialGradient(W*.82,120,10,W*.82,120,520);glow.addColorStop(0,"rgba(246,183,200,.45)");glow.addColorStop(1,"rgba(246,183,200,0)");ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
 let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 for(let i=0;i<280;i++){const x=rnd()*W,y=rnd()*H,r=rnd()*1.8+.3;ctx.globalAlpha=.18+rnd()*.55;ctx.fillStyle=rnd()<.2?"#ffd6e2":"#ffffff";ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
 ctx.globalAlpha=1;
 // the rink at the foot
 ctx.fillStyle="rgba(255,255,255,.07)";ctx.beginPath();ctx.ellipse(W/2,H+60,W*.78,240,0,0,7);ctx.fill();
 ctx.strokeStyle="rgba(255,255,255,.12)";ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(W/2,H+60,W*.62,190,0,Math.PI,2*Math.PI);ctx.stroke();
 // header
 ctx.textAlign="center";ctx.textBaseline="alphabetic";
 ctx.fillStyle="#eceaff";ctx.font=`700 20px ${F.body}`;spaced("THE READER'S ATLAS",W/2,78,5);
 ctx.fillStyle="#ffffff";ctx.font=`400 156px ${F.script}`;ctx.fillText("Maple Hills",W/2,214);
 ctx.fillStyle="#f6b7c8";ctx.font=`italic 400 40px ${F.disp}`;ctx.fillText("Reading order · Hannah Grace",W/2,274);
 const cols=BOOKLIST.map(b=>b.col),seg=360/cols.length;cols.forEach((c,i)=>{ctx.fillStyle=c;rr(W/2-180+i*seg+3,300,seg-6,6,3);ctx.fill()});
 // covers
 items.forEach((it,i)=>{const r=Math.floor(i/COLS),c=i%COLS,inRow=Math.min(COLS,items.length-r*COLS),x=M+(COLS-inRow)*(CW+GAP)/2+c*(CW+GAP),y=HEAD+r*(CH+TXT+RGAP);
  if(it.b){const b=it.b,img=imgs[b.c],col=b.col;
   ctx.save();ctx.shadowColor="rgba(10,8,40,.6)";ctx.shadowBlur=30;ctx.shadowOffsetY=14;rr(x,y,CW,CH,10);ctx.fillStyle="#000";ctx.fill();ctx.restore();
   if(img){ctx.save();rr(x,y,CW,CH,10);ctx.clip();const k=Math.max(CW/img.naturalWidth,CH/img.naturalHeight),dw=img.naturalWidth*k,dh=img.naturalHeight*k;ctx.drawImage(img,x+(CW-dw)/2,y+(CH-dh)/2,dw,dh);ctx.restore()}
   else{const g=ctx.createLinearGradient(x,y,x+CW,y);g.addColorStop(0,col);g.addColorStop(1,shade(col,-.25));rr(x,y,CW,CH,10);ctx.fillStyle=g;ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.95)";ctx.font=`400 84px ${F.script}`;ctx.textBaseline="middle";ctx.fillText(b.title,x+CW/2,y+CH/2);ctx.textBaseline="alphabetic"}
   rr(x,y,CW,CH,10);ctx.strokeStyle="rgba(255,255,255,.18)";ctx.lineWidth=2;ctx.stroke();
   ctx.beginPath();ctx.arc(x+10,y+10,32,0,7);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle="#1b1846";ctx.stroke();
   ctx.fillStyle="#ffffff";ctx.font=`700 28px ${F.body}`;ctx.textBaseline="middle";ctx.fillText(String(b.order),x+10,y+12);ctx.textBaseline="alphabetic";
   const L=wrap(b.title,CW,`400 34px ${F.disp}`);ctx.fillStyle="#ffffff";L.forEach((l,k)=>ctx.fillText(l,x+CW/2,y+CH+44+k*36));
   ctx.fillStyle=shade(col,.35);ctx.font=`700 16px ${F.body}`;spaced(`BOOK ${b.n} · ${b.year}`,x+CW/2,y+CH+44+L.length*36+4,2);
  } else {const u=it.u,col="#f6b7c8";
   rr(x,y,CW,CH,10);ctx.fillStyle="rgba(255,255,255,.06)";ctx.fill();ctx.setLineDash([12,10]);ctx.lineWidth=3;ctx.strokeStyle=col;ctx.stroke();ctx.setLineDash([]);
   ctx.fillStyle=col;ctx.font=`700 20px ${F.body}`;spaced("COMING",x+CW/2,y+CH/2-20,5);ctx.fillStyle="#ffffff";ctx.font=`400 72px ${F.script}`;ctx.fillText(u.date,x+CW/2,y+CH/2+50);
   const L=wrap(u.title,CW,`400 34px ${F.disp}`);ctx.fillStyle="#e3e0ff";L.forEach((l,k)=>ctx.fillText(l,x+CW/2,y+CH+44+k*36));
   ctx.fillStyle=col;ctx.font=`700 16px ${F.body}`;spaced(`BOOK ${u.n} · TITLE TBA`,x+CW/2,y+CH+44+L.length*36+4,2)}});
 // footer
 ctx.fillStyle="#eceaff";ctx.font=`700 20px ${F.body}`;spaced("READERSATLAS.COM  ·  @READERS.ATLAS",W/2,H-76,4);
 ctx.fillStyle="#b9b5e6";ctx.font=`400 18px ${F.body}`;ctx.fillText("Unofficial fan guide. Not affiliated with Hannah Grace or her publishers.",W/2,H-42);
}
/* Load one cover: try each source in turn; null means "draw a spine". cors=true lets the canvas be exported. */
function loadCover(srcs,cors){return new Promise(res=>{let i=0;const next=()=>{if(i>=srcs.length)return res(null);const im=new Image();if(cors)im.crossOrigin="anonymous";
 im.onload=()=>im.naturalWidth>10?res(im):next();im.onerror=next;im.src=srcs[i++]};next()})}


const covers={};
const cv=document.getElementById("cv"),st=document.getElementById("status"),dl=document.getElementById("dl");
const items=[...BOOKLIST.map((b,i)=>({b:{...b,order:i+1}})),{u:{title:"Maple Hills Book 4",date:"2027",s:"mh",n:4}}];
const draw=()=>drawPoster(cv,"all",items,covers);
const srcs=c=>[...(ISBNS[c]||[]).map(i=>`https://covers.openlibrary.org/b/isbn/${i}-L.jpg?default=false`),...(LOCAL_COVERS[c]?[LOCAL_COVERS[c]]:[])];
async function loadAll(){let done=0;
 await Promise.all(BOOKLIST.map(async b=>{covers[b.c]=await loadCover(srcs(b.c),true);done++;st.textContent=`Loading covers… ${done} of ${BOOKLIST.length}`;draw()}));
 const miss=BOOKLIST.filter(b=>!covers[b.c]).map(b=>b.title);
 st.textContent=miss.length?`Ready. ${miss.length} cover${miss.length>1?"s":""} not found, shown as a coloured spine: ${miss.join(", ")}.`:"Ready. All covers loaded.";
 dl.disabled=false}
dl.addEventListener("click",()=>{
 try{cv.toBlob(bl=>{if(!bl){st.textContent="Couldn't create the PNG. Long-press (or right-click) the poster and save the image instead.";return}
  const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="maple-hills-reading-order.png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);st.textContent="Downloaded."},"image/png")}
 catch(e){st.textContent="Couldn't create the PNG because a cover blocked export. Long-press (or right-click) the poster and save the image instead."}});
draw();
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{draw();loadAll()});
</script>
